<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PICA - Sesli Asistan</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02070d;--panel:#07121c;--panel2:#0b1c2b;--line:#12384f;--ink:#dff6ff;--muted:#6f98ad;--gold:#3de0ff;--gold2:#1a8fb8;--dark-ink:#00131c;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:radial-gradient(120% 70% at 50% -10%,#0a2a40 0%,#02070d 60%);color:var(--ink);font:400 16px/1.5 'Rajdhani',system-ui,sans-serif}
.app{height:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;position:relative;z-index:1}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(rgba(61,224,255,.05) 1px,transparent 1px) 0 0/100% 38px,linear-gradient(90deg,rgba(61,224,255,.05) 1px,transparent 1px) 0 0/38px 100%}
header{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.orb{border-radius:50%;background:radial-gradient(circle,#eaffff 0 9%,#3de0ff 10% 24%,#04202c 25% 38%,transparent 39%),repeating-conic-gradient(#3de0ff 0 7deg,transparent 7deg 30deg);position:relative;flex:none;border:2px solid var(--gold);box-shadow:0 0 30px rgba(61,224,255,.5),inset 0 0 18px rgba(61,224,255,.45);animation:spin 18s linear infinite}
.orb::before,.orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--gold);opacity:0}
.sm{width:42px;height:42px}
.who{flex:1;min-width:0}
.who h1{margin:0;font:700 20px 'Orbitron',sans-serif;letter-spacing:3px}
.who p{margin:0;font-size:12.5px;color:var(--muted)}
.pill{border:1px solid var(--gold2);background:var(--panel);color:var(--gold);border-radius:2px;padding:8px 14px;font:700 11px 'Orbitron',sans-serif;cursor:pointer;white-space:nowrap;letter-spacing:1.2px;text-transform:uppercase}
.pill:hover{border-color:var(--gold);color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(61,224,255,.06);color:var(--gold);border-radius:2px;padding:9px 14px;font:700 11px 'Orbitron',sans-serif;cursor:pointer;letter-spacing:1.2px;text-transform:uppercase}
.chip:hover{border-color:var(--gold);background:rgba(61,224,255,.12)}
#chat{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:86%;padding:12px 16px;border-radius:4px;animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ai{align-self:flex-start;background:rgba(7,25,38,.85);border:1px solid var(--line);border-left:3px solid var(--gold)}
.me{align-self:flex-end;background:rgba(61,224,255,.14);color:var(--ink);font-weight:600;border:1px solid var(--gold2)}
.nm{display:block;font:700 11px 'Orbitron',sans-serif;letter-spacing:1.5px;color:var(--gold);margin-bottom:3px;text-transform:uppercase}
a.btn{display:inline-block;margin:10px 8px 0 0;padding:9px 16px;border-radius:2px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark-ink);text-decoration:none;font:700 11px 'Orbitron',sans-serif;letter-spacing:1.2px;text-transform:uppercase}
a.btn.alt{background:transparent;color:var(--gold);border:1px solid var(--gold2)}
pre{margin:10px 0 0;background:#000;border:1px solid var(--line);border-radius:12px;padding:10px 12px;overflow-x:auto;font-size:13px;color:var(--gold)}
code.pw{background:#000;border:1px solid var(--line);padding:5px 11px;border-radius:8px;font-size:17px;letter-spacing:1px;color:var(--gold)}
.cp{margin-top:8px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 11px;font:700 11px 'Orbitron',sans-serif;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--gold);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
.bar{display:flex;gap:8px;align-items:center;margin:0 12px 12px;padding:6px;background:var(--panel);border:1px solid var(--gold2);border-radius:6px;box-shadow:0 0 18px rgba(61,224,255,.12)}
.bar:focus-within{border-color:var(--gold)}
.bar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:16px 'Rajdhani',sans-serif;padding:8px 6px;outline:none}
.bar input::placeholder{color:var(--muted)}
.ib{width:44px;height:44px;border-radius:4px;border:0;display:grid;place-items:center;cursor:pointer;flex:none;background:var(--panel2);color:var(--ink)}
#mic.on{background:var(--gold);color:var(--dark-ink)}
#send{background:transparent;color:var(--gold);border:1px solid var(--gold2);font:700 11px 'Orbitron',sans-serif;letter-spacing:1.2px;text-transform:uppercase}
#vc{width:auto;padding:0 14px;gap:8px;display:flex;align-items:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark-ink);font:700 11px 'Orbitron',sans-serif;letter-spacing:1.2px;text-transform:uppercase}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body[data-s=listen] .orb::before{border-color:#fff;animation:ring 1.3s ease-out infinite}
body[data-s=talk] .orb::before{animation:ring 1.5s ease-out infinite}
body[data-s=talk] .orb::after{animation:ring 1.5s ease-out .6s infinite}
body[data-s=think] .orb{animation:pulse 1s ease-in-out infinite}
@keyframes ring{0%{transform:scale(.95);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@keyframes pulse{50%{transform:scale(.9);filter:brightness(.8)}}
@keyframes spin{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;z-index:20;background:radial-gradient(90% 60% at 50% 35%,#0b3350 0%,#02070d 70%);display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center}
.ov.on{display:flex}
.big{width:min(52vw,220px);height:min(52vw,220px);margin-top:6vh;cursor:pointer;outline:1px dashed rgba(61,224,255,.55);outline-offset:16px}
#vname{font:700 13px 'Orbitron',sans-serif;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
#vstat{font:700 22px 'Orbitron',sans-serif;margin:6px 0 14px}
#cap{max-width:560px;max-height:30vh;overflow-y:auto;color:#cfc9be;font-size:16px}
#cap b{display:block;color:var(--muted);font-weight:500;font-size:14px;margin-bottom:8px}
.end{border:0;border-radius:999px;background:#2a1212;color:#ff8a80;border:1px solid #5a2323;padding:14px 34px;font:700 15px 'Orbitron',sans-serif;cursor:pointer;text-transform:uppercase;letter-spacing:1.2px}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sp{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sp h2{margin:0 0 4px;font:700 18px 'Orbitron',sans-serif}.sp>p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.vc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;margin-bottom:8px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;color:var(--ink);cursor:pointer;font:inherit}
.vc.sel{border-color:var(--gold)}
.vc .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 16px 'Orbitron',sans-serif;color:var(--dark-ink);background:linear-gradient(135deg,var(--gold),var(--gold2))}
.vc b{display:block;font-family:'Orbitron',sans-serif}.vc small{color:var(--muted)}
#pv{display:none;align-items:center;gap:10px;margin:0 12px 8px;padding:8px;border:1px solid var(--gold2);border-radius:6px;background:var(--panel);font-size:15px;color:var(--muted)}
#pv.on{display:flex}#pv img{width:44px;height:44px;object-fit:cover;border-radius:4px}#pv span{flex:1}
#pvx{background:none;border:0;color:var(--gold);font-size:18px;cursor:pointer}
.m img{max-width:100%;border-radius:4px;display:block;margin-bottom:8px}
@media(max-width:520px){.vt{display:none}#vc{padding:0;width:44px;justify-content:center}}
</style>
</head>
<body data-s="idle">
<div class="app">
  <header>
    <div class="orb sm"></div>
    <div class="who"><h1>PICA</h1><p id="status">Sistemler hazır</p></div>
    <span class="pill" id="vbtn">● Çevrimiçi</span>
  </header>
  <div class="chips" id="chips"></div>
  <div id="chat"></div>
  <div id="pv"><img id="pvi" alt=""><span>Fotoğraf hazır. Bir şey sor ya da gönder.</span><button id="pvx" aria-label="Kaldır">✕</button></div>
  <div class="bar">
    <button class="ib" id="mic" aria-label="Dinle"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="ib" id="att" aria-label="Fotoğraf ekle"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 8"/></svg></button><input type="file" id="file" accept="image/*" hidden><input id="inp" placeholder="PICA'ya yaz…" autocomplete="off">
    <button class="ib" id="vc" aria-label="Sesli sohbet"><svg viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg><span class="vt">Sesli sohbet</span></button>
    <button class="ib" id="send" aria-label="Gönder"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</div>

<div class="ov" id="ov">
  <div><div id="vname">PICA</div><div class="orb big" id="bigorb"></div></div>
  <div><div id="vstat">Dinliyorum…</div><div id="cap"></div></div>
  <button class="end" id="endv">Sohbeti bitir</button>
</div>

<div class="sheet" id="sheet"><div class="sp">
  <h2>PICA'nın sesi</h2><p>Birine dokun, kısa bir selam duy. Sesler cihazındaki Türkçe seslerden gelir.</p>
  <div id="vlist"></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const chat=$('chat'),inp=$('inp');
let ttsOn=true,rec=null,listening=false,voiceMode=false,busy=false,pendingEnd=false,spk=0,vIdx=0,voices=[];

function curVoice(){return voices.length?voices[cur().slot%voices.length]:null}
function renderList(){$('vlist').innerHTML='';P.forEach((p,i)=>{const b=document.createElement('button');b.className='vc'+(i===vIdx?' sel':'');
 b.innerHTML=`<span class="av">${p.n[0]}</span><span><b>${p.n}</b><small>${p.d}</small></span>`;
 b.onclick=()=>{vIdx=i;setVoiceUI();renderList();speak(
